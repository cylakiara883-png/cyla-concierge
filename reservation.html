<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | Cyla Concierge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">CYLA CONCIERGE</div>

    <div class="menu">
        <a href="index.html">Accueil</a>
        <a href="flotte.html">Notre flotte</a>
    </div>
</nav>

<section class="reservation-page">

    <h1>Réserver votre véhicule</h1>

    <form class="reservation-form">

        <input type="text" id="nom" placeholder="Nom complet" required>

        <input type="email" id="email" placeholder="Adresse e-mail" required>

        <input type="tel" id="telephone" placeholder="Téléphone" required>

        <select id="vehicule" required>
            <option>Choisir un véhicule</option>
            <option>Range Rover SV</option>
            <option>Mercedes Classe S</option>
            <option>Rolls-Royce</option>
        </select>

        <input type="date" id="debut" required>

        <input type="date" id="fin" required>

        <textarea id="message" placeholder="Demandes particulières..." rows="5"></textarea>

        <button type="button" onclick="envoyerWhatsApp()">
            Envoyer la demande
        </button>

    </form>

</section>

</body>
</html>
